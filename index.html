<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELMIRA</title>
<style>
:root{--bg:#f6f4fd;--card:#fff;--ink:#16224a;--mut:#58628d;--pr:#7c3aed;--ln:#e3ddf6;--soft:#ede7fd;--warn:#fff4d6;--warnt:#6b4b00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121430;--card:#1c1f45;--ink:#e8eaff;--mut:#a5acd8;--pr:#8b5cf6;--ln:#2e3266;--soft:#272b5c;--warn:#3a3114;--warnt:#f3d98a}}
:root[data-theme="dark"]{--bg:#121430;--card:#1c1f45;--ink:#e8eaff;--mut:#a5acd8;--pr:#8b5cf6;--ln:#2e3266;--soft:#272b5c;--warn:#3a3114;--warnt:#f3d98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-family:Georgia,"Times New Roman",serif}
h1{font-size:clamp(1.9rem,7vw,3rem)}h2{font-size:1.45rem;margin-top:1.6em}h3{font-size:1.1rem}
p{margin:0 0 1em}
.demo{background:var(--warn);color:var(--warnt);font-size:.82rem;padding:.4rem 1rem;text-align:center}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;max-width:1000px;margin:auto}
.logo{font:700 1.35rem Georgia,serif;letter-spacing:.06em;cursor:pointer;background:none;border:0;color:var(--ink)}
.logo span{color:var(--pr)}
.ic{display:flex;gap:.3rem}
.ib{position:relative;background:none;border:0;color:var(--ink);font-size:1.15rem;min-width:44px;min-height:44px;cursor:pointer;border-radius:12px}
.ib:hover{background:var(--soft)}
.cnt{position:absolute;top:4px;right:2px;background:var(--pr);color:#fff;border-radius:9px;font-size:.68rem;padding:0 5px;min-width:17px}
nav{display:flex;gap:.2rem;overflow-x:auto;padding:0 .75rem .5rem;max-width:1000px;margin:auto;scrollbar-width:none}
nav button{flex:none;background:none;border:0;color:var(--mut);padding:.45rem .8rem;border-radius:20px;font:inherit;font-size:.92rem;cursor:pointer}
nav button.on{background:var(--soft);color:var(--pr);font-weight:600}
main{max-width:1000px;margin:auto;padding:1.2rem 1rem 3rem}
.page{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.page{animation:none}}
.btn{background:var(--pr);color:#fff;border:2px solid var(--pr);border-radius:14px;padding:.7rem 1.2rem;font:600 .95rem inherit;font-family:inherit;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:var(--pr)}.btn.sm{padding:.45rem .9rem;min-height:36px}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.hero{padding:2rem 0 1rem}.hero p{max-width:60ch;color:var(--mut);font-size:1.05rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:1.1rem;display:flex;flex-direction:column;gap:.4rem;position:relative}
.card p{color:var(--mut);font-size:.93rem;flex:1}
.card.link{cursor:pointer;transition:transform .2s}.card.link:hover{transform:translateY(-3px)}
.badge{align-self:flex-start;background:var(--soft);color:var(--pr);border-radius:10px;font-size:.78rem;padding:.1rem .6rem;font-weight:600}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.3rem 0 .8rem;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:20px;padding:.4rem .9rem;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.ph{height:130px;border-radius:12px;background:linear-gradient(135deg,var(--soft),var(--ln));display:grid;place-items:center;color:var(--mut);font-size:.85rem}
.hb{position:absolute;top:.6rem;right:.6rem;background:var(--card);border:1px solid var(--ln);border-radius:50%;width:40px;height:40px;font-size:1.2rem;color:var(--pr);cursor:pointer}
.av{width:120px;height:120px;border-radius:30px;background:linear-gradient(135deg,var(--pr),#4c1d95);color:#fff;font:700 2.2rem Georgia,serif;display:grid;place-items:center;margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:1.2rem 0}
.stats div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:.9rem}
.stats b{display:block;font:700 1.4rem Georgia,serif;color:var(--pr)}
ul.dir{padding-left:1.2rem}ul.dir li{margin:.3rem 0}
label{display:block;font-size:.88rem;color:var(--mut);margin:.8rem 0 .25rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
form{max-width:480px}
.msg{padding:.7rem 1rem;border-radius:12px;margin:.8rem 0;background:var(--soft)}
.msg.err{background:#fde2e2;color:#8a1c1c}
.msg.note{background:var(--warn);color:var(--warnt);font-size:.88rem}
.price{font:700 1.3rem Georgia,serif;color:var(--pr)}
.item{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.8rem 0;border-bottom:1px solid var(--ln)}
.q{display:inline-flex;align-items:center;gap:.5rem}
.q button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,10,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem 1rem}
.box{background:var(--bg);border-radius:20px;padding:1.2rem;width:100%;max-width:520px;max-height:85%;overflow:auto;animation:in .25s}
.tabs{display:flex;gap:.4rem;margin-bottom:.5rem;overflow-x:auto}
.empty{text-align:center;padding:2rem 1rem;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:.82rem;padding:1rem}
.big{padding:1.6rem;min-height:180px;text-decoration:none;color:inherit;justify-content:space-between}.off{opacity:.65}.btn[disabled]{opacity:.5;cursor:not-allowed}.card.big .btn{text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="demo" id="db">Сервер әлі қосылмаған: тіркелу, курстар және хабарлама жіберу жұмыс істемейді; онлайн төлем қосылмаған.</div>
<header>
<div class="top">
<button class="logo" data-go="" aria-label="Басты бет">ELMIRA <span>★</span></button>
<div class="ic">
<button class="ib" data-search aria-label="Іздеу">🔍</button>

<button class="ib" data-go="account" aria-label="Жеке кабинет">👤</button>
</div></div>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<footer>© ELMIRA · <button class="chip" id="adm" data-go="admin">Әкімші</button></footer>
<div id="ovr"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ↓ Нақты дүкен сілтемелерін осы жерге қойыңыз (әкімші панелі дайын жолды береді) */
const CONFIG={kaspi:"https://kaspi.kz/shop/info/merchant/13531014/address-tab/?merchantId=13531014&productCode=129311460&baseProductCode=&tabId=PRODUCT&srsltid=AU7gw4VxViUqtm8wdeUvtWB3wErpQYfp_MdLmeh5YWn3sK6RZhpGQaDm",wb:"https://www.wildberries.am/seller/1042107",
/* Supabase: Project URL және anon public key (ашық кілт) — құпия service_role кілтін ЕШҚАШАН қоймаңыз */
supabaseUrl:"",supabaseKey:""};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={links:{},fav:[],user:null,users:[],tab:'courses',ecat:'Барлығы',pre:null,authTab:'in'};
try{Object.assign(S,JSON.parse(localStorage.getItem('elmira')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('elmira',JSON.stringify({links:S.links,fav:S.fav,user:S.user,users:S.users}))}catch(e){}};
const okU=(k,u)=>{try{const h=new URL(u);return h.protocol==='https:'&&(k==='kaspi'?/(^|\.)kaspi\.kz$/.test(h.hostname):/(^|\.)(wildberries\.(ru|kz|by|kg|am|uz|ge|com)|wb\.ru)$/.test(h.hostname))}catch(e){return false}};
const links=()=>{const r={};for(const k of['kaspi','wb']){const u=(S.links&&S.links[k])||CONFIG[k]||'';r[k]=okU(k,u)?u:''}return r};
const sb=(CONFIG.supabaseUrl&&CONFIG.supabaseKey&&window.supabase)?supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{flowType:'pkce'}}):null;
const dbErr=e=>'<div class="msg err">Қате: '+esc(e.message||e)+'</div>';
async function loadSession(){if(!sb)return;const {data}=await sb.auth.getSession();const u=data.session&&data.session.user;
if(!u){S.user=null;return}const {data:p}=await sb.from('profiles').select('name,role').eq('id',u.id).maybeSingle();S.user={id:u.id,email:u.email,name:(p&&p.name)||u.email,role:(p&&p.role)||'user'}}
async function authAct(k,d){const m=h=>{$('#am').innerHTML=h},back=location.origin+location.pathname;
if(k==='up'){const {error}=await sb.auth.signUp({email:d.e,password:d.p,options:{data:{name:d.n.trim()},emailRedirectTo:back}});return m(error?dbErr(error):'<div class="msg">Тіркелу сәтті. Растау хаты келсе, поштадағы сілтемені басып, «Кіру» бөліміне өтіңіз.</div>')}
if(k==='in'){const {error}=await sb.auth.signInWithPassword({email:d.e,password:d.p});if(error)return m(dbErr(error));await loadSession();return R()}
if(k==='reset'){const {error}=await sb.auth.resetPasswordForEmail(d.e,{redirectTo:back});return m(error?dbErr(error):'<div class="msg">Егер пошта тіркелген болса, қалпына келтіру сілтемесі жіберілді.</div>')}
if(k==='newpw'){const {error}=await sb.auth.updateUser({password:d.p});if(error)return m(dbErr(error));S.recovery=false;S.authTab='in';await loadSession();R()}}
async function adminAct(k,d,f){const m={addc:'#m2',addl:'#m3',grant:'#m4'}[k],o=h=>{$(m).innerHTML=h};let r;
if(k==='addc')r=await sb.from('courses').insert({title:d.t,description:d.d,price:+d.p||0,duration:d.u});
if(k==='addl')r=await sb.from('lessons').insert({course_id:d.c,title:d.t,content:d.b,position:+d.o||0});
if(k==='grant'){const {data:p}=await sb.from('profiles').select('id').eq('email',d.e.trim()).maybeSingle();if(!p)return o('<div class="msg err">Бұл поштамен пайдаланушы табылмады. Ол алдымен тіркелуі керек.</div>');r=await sb.from('enrollments').upsert({user_id:p.id,course_id:d.c})}
if(r.error)return o(dbErr(r.error));o('<div class="msg">Сақталды.</div>');f.reset();hooks.admin()}
const cfgLine=()=>{const L=links();return 'const CONFIG={kaspi:'+JSON.stringify(L.kaspi)+',wb:'+JSON.stringify(L.wb)+'};'};
const NAV=[['','Басты бет'],['about','Эльмира туралы'],['edu','Білім'],['shop','Дүкен'],['projects','Жобалар'],['contact','Байланыс']];
const ECATS=['Барлығы','Геодезия','Картография','Маркшейдерлік іс','AutoCAD','Зертханалық жұмыстар'];

const MAT=[
{id:'m1',t:'Карта масштабы: ұзындық пен ауданды есептеу',d:'Масштабты түсіну және картадағы өлшемдерді жер бетіндегі қашықтыққа айналдыру.',c:'Картография'},
{id:'m2',t:'Жер бедері және горизонтальдар',d:'Нүкте биіктігін анықтау, беткейдің тіктігін түсіну және профиль құру.',c:'Картография'},
{id:'m3',t:'Теодолит: құрылымы және өлшеу тәртібі',d:'Аспаптың негізгі бөліктері және далалық жұмыстың орындалу реті.',c:'Геодезия'},
{id:'m4',t:'AutoCAD-та алғашқы геодезиялық сызба',d:'Координаталармен жұмыс істеуге және алғашқы сызбаны орындауға кіріспе.',c:'AutoCAD'}];
const COURSES=[];
const heart=id=>`<button class="hb" data-fav="${id}" aria-label="Таңдаулыларға">${S.fav.includes(id)?'♥':'♡'}</button>`;
const card=(t,d,b,g)=>`<div class="card"><h3>${t}</h3><p>${d}</p><button class="btn sm" data-go="${g}" style="align-self:flex-start">${b}</button></div>`;
const chips=(arr,cur,k)=>`<div class="chips">${arr.map(c=>`<button class="chip ${c===cur?'on':''}" data-chip="${k}" data-v="${esc(c)}">${c}</button>`).join('')}</div>`;




const pages={
'':()=>`<section class="hero"><h1>Сәлем! Мен — Эльмира.</h1><p>Мен — инженерлік тәжірибесін білім берумен ұштастырған оқытушымын. Бұл сайтта өзім туралы, геодезия мен маркшейдерлік іс бағытындағы жұмысым, оқу материалдарым және кәсіпкерлік жобаларым туралы бөлісемін.</p>
<div class="row"><button class="btn" data-go="about">Менімен танысу</button><button class="btn ghost" data-go="edu">Оқу материалдары</button><button class="btn ghost" data-go="shop">Дүкенге кіру</button></div></section>
<h2>Бір кеңістікте — үш бағыт</h2><div class="grid">
${card('Менің жолым','Инженерлік жұмыстан оқытушылыққа дейінгі тәжірибеммен танысыңыз.','Толығырақ','about')}
${card('Білім және тәжірибе','Геодезия, картография және маркшейдерлік іс бойынша түсінікті материалдар.','Материалдарды көру','edu')}
${card('ELMIRA дүкені','Күнделікті өмірге арналған тауарларды бір жерден таңдаңыз.','Дүкенге өту','shop')}</div>`,
about:()=>`<div class="av">ЭТ</div><h1>Эльмира Таттымбетова</h1><p style="font-size:1.1rem;color:var(--pr);font-weight:600">Инженер. Оқытушы. Кәсіпкер.</p>
<p>Менің толық аты-жөнім — Таттымбетова Эльмира Танатаровна. Қарағанды қаласында тұрамын.</p>
<p>1999–2004 жылдары Қарағанды мемлекеттік техникалық университетінде “Маркшейдерлік іс” мамандығы бойынша білім алдым.</p>
<p>2004–2023 жылдары инженер болып жұмыс істедім. Осы 19 жылда жинаған өндірістік тәжірибемді қазір оқытушылық қызметімде қолданамын.</p>
<p>2024 жылдан бастап арнайы пәндерді оқытуға кірістім. Инновациялық технологиялар колледжінде жұмыс істеп, оқу-өндірістік жұмысты ұйымдастыруға да қатыстым.</p>
<p>2026 жылдың қыркүйегінен бастап университеттің “Маркшейдерлік іс және геодезия” кафедрасында аға оқытушы болып жұмыс істеймін.</p>
<p>Мен үшін күрделі тақырыпты қарапайым тілмен түсіндіру маңызды. Сабақтарымда есептің жауабымен бірге оның қалай шығарылатынын және өндірісте не үшін қажет екенін көрсетуге тырысамын.</p>
<p>Оқытушылықпен қатар кәсіпкерлікпен айналысамын. Осы сайт білім беру жұмысым мен кәсіпкерлік жобаларымды бір жерге жинақтау үшін жасалды.</p>
<div class="stats"><div><b>19 жыл</b>инженерлік тәжірибе</div><div><b>2024 жылдан</b>оқытушылық қызмет</div><div><b>Қарағанды</b>жұмыс істейтін қалам</div></div>
<h2>Менің негізгі бағыттарым</h2><ul class="dir"><li>Геодезия және геодезиялық өлшеулер.</li><li>Маркшейдерлік іс.</li><li>Карталармен және жер бедерімен жұмыс.</li><li>Зертханалық жұмыстар мен есептер.</li><li>Оқу-әдістемелік материалдар.</li><li>Онлайн сауда.</li></ul>`,
edu:()=>{const l=MAT.filter(m=>S.ecat==='Барлығы'||m.c===S.ecat);
return`<h1>Күрделі тақырыптарды қарапайым қадамдармен үйреніңіз</h1><p style="color:var(--mut)">Бұл бөлімде геодезия, картография және маркшейдерлік іс бойынша оқу материалдары жинақталады. Әр материал тақырыпты түсінуге, есепті орындауға және білімді тәжірибеде қолдануға көмектеседі.</p>
${chips(ECATS,S.ecat,'ecat')}
${l.length?`<div class="grid">${l.map(m=>`<div class="card">${heart(m.id)}<span class="badge">Дайындалуда</span><h3>${m.t}</h3><p>${m.d}</p><small style="color:var(--mut)">${m.c}</small></div>`).join('')}</div>`:'<div class="empty">Бұл санатта материалдар әзірге жоқ.</div>'}
<div id="crs">${sb?'':'<div class="msg note">Курстар сервер қосылғанда осы жерде көрінеді.</div>'}</div>`},
shop:()=>{const L=links();
const c=(n,u)=>u?`<a class="card link big" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><h2>${n}</h2><span class="btn">${n} дүкеніне өту</span></a>`:`<div class="card big off"><h2>${n}</h2><span class="badge">Жақында қосылады</span><button class="btn" disabled>${n} дүкеніне өту</button></div>`;
return`<h1>Қай жерден сатып алғыңыз келеді?</h1><div class="grid">${c('Kaspi',L.kaspi)}${c('Wildberries',L.wb)}</div><div class="msg note">Тауарды сатып алу таңдалған маркетплейс арқылы өтеді; сайтта себет пен төлем жоқ. Компьютерде дүкен жаңа қойындыда ашылады. Телефонда қолданба орнатылған болса, сілтеме көбіне соның өзінде ашылады, болмаса браузерде.</div>`},
projects:()=>`<h1>Менің жұмыс бағыттарым мен жобаларым</h1><div class="grid">
${card('Оқу материалдары','Студенттерге арналған түсіндірмелер, есептер және зертханалық жұмыс нұсқаулықтары.','Білім бөліміне өту','edu')}
${card('Практикаға бағытталған оқыту','Теорияны өлшеу, есептеу және сызба жұмыстарымен байланыстыру.','Сұрақ қою','ask')}
${card('Кәсіпкерлік','Тауарларды таныстыру және онлайн сатылымды дамыту.','Дүкенді ашу','shop')}</div>
<div class="msg note">Орындалған жобалар туралы нақты материалдар кейін қосылады.</div>`,
contact:()=>{const pr=S.pre;S.pre=null;return`<h1>Маған жазыңыз</h1><p style="color:var(--mut)">Оқу материалдары, тауарлар немесе серіктестік бойынша сұрағыңыз бар ма? Төмендегі форманы толтырыңыз.</p>
<form data-form="contact"><label>Атыңыз</label><input name="n" required><label>Электрондық поштаңыз</label><input name="e" type="email" required>
<label>Тақырып</label><select name="s">${['Оқу туралы','Тапсырыс туралы','Серіктестік','Басқа сұрақ'].map(x=>`<option ${pr&&x===pr.s?'selected':''}>${x}</option>`).join('')}</select>
<label>Хабарлама</label><textarea name="m" rows="5" required>${pr?esc(pr.m):''}</textarea><div id="fm"></div><button class="btn" style="margin-top:.8rem">Хабарламаны жіберу</button></form>
${sb?'':'<div class="msg note">Сервер қосылмаған: хабарлама ешқайда жіберілмейді.</div>'}`},
account:()=>{const u=S.user;
if(!u||S.recovery){const t=S.recovery?'newpw':S.authTab;
return`<h1>ELMIRA кеңістігіне қош келдіңіз!</h1><div class="tabs"><button class="chip ${t==='in'?'on':''}" data-auth="in">Кіру</button><button class="chip ${t==='up'?'on':''}" data-auth="up">Тіркелу</button><button class="chip ${t==='reset'?'on':''}" data-auth="reset">Құпиясөзді қалпына келтіру</button></div>
<form data-form="${t}">${t==='up'?'<label>Аты</label><input name="n" required>':''}${t==='newpw'?'':'<label>Электрондық пошта</label><input name="e" type="email" required>'}${t==='reset'?'':'<label>'+(t==='newpw'?'Жаңа құпиясөз':'Құпиясөз')+'</label><input name="p" type="password" required minlength="6">'}<div id="am"></div><button class="btn" style="margin-top:.8rem">${{in:'Кіру',up:'Тіркелу',reset:'Хатты жіберу',newpw:'Құпиясөзді сақтау'}[t]}</button></form>
${sb?'':'<div class="msg note">Сервер әлі қосылмаған: нақты тіркелу, кіру және қалпына келтіру жұмыс істемейді. Төмендегі кіру тек осы браузерде сынау үшін, құпиясөз тексерілмейді.</div>'}`}
const T=[['courses','Менің курстарым'],['favs','Таңдаулылар'],['profile','Профиль']];
let b='';
if(S.tab==='courses')b=sb?'<div id="myc">Жүктелуде…</div>':'<div class="empty">Сіз әлі курсқа жазылмадыңыз.<div class="row" style="justify-content:center"><button class="btn" data-go="edu">Курстарды көру</button></div></div>';

if(S.tab==='favs'){const f=S.fav.map(id=>MAT.find(m=>m.id===id)).filter(Boolean);b=f.length?`<div class="grid">${f.map(m=>`<div class="card">${heart(m.id)}<span class="badge">Дайындалуда</span><h3>${m.t}</h3><p>${m.d}</p></div>`).join('')}</div>`:'<div class="empty">Таңдаулылар тізімі бос. Материал карточкасындағы ♡ белгісін басыңыз.</div>'}
if(S.tab==='profile')b=`<div class="card"><p>Аты: <b>${esc(u.name)}</b></p><p>Пошта: <b>${esc(u.email)}</b></p></div><div class="row"><button class="btn ghost" data-logout>Шығу</button></div>`;
return`<h1>Сәлем, ${esc(u.name)}!</h1><div class="tabs">${T.map(t=>`<button class="chip ${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}<button class="chip" data-logout>Шығу</button></div>${b}`},
admin:()=>{if(!sb)return'<div class="empty"><h2>Әкімші панелі</h2><p>Ол сервер (Supabase) қосылғанда жұмыс істейді. Дүкен сілтемелері файлдағы CONFIG ішінде.</p></div>';
if(!(S.user&&S.user.role==='admin'))return'<div class="empty"><h2>Қолжетімділік жоқ.</h2><p>Бұл бетке тек әкімші кіре алады.</p></div>';
return`<h1>Әкімші панелі</h1><h2>Хабарламалар</h2><div id="am1">Жүктелуде…</div>
<h2>Курс қосу</h2><form data-form="addc"><label>Атауы</label><input name="t" required><label>Сипаттамасы</label><textarea name="d" rows="3"></textarea><label>Бағасы (₸, 0 — тегін)</label><input name="p" type="number" min="0" value="0"><label>Ұзақтығы</label><input name="u"><div id="m2"></div><button class="btn" style="margin-top:.8rem">Курсты қосу</button></form>
<h2>Сабақ қосу</h2><form data-form="addl"><label>Курс</label><select name="c" id="lc" required></select><label>Сабақ атауы</label><input name="t" required><label>Мәтін, мысалдар</label><textarea name="b" rows="6"></textarea><label>Реті</label><input name="o" type="number" value="1"><div id="m3"></div><button class="btn" style="margin-top:.8rem">Сабақты қосу</button></form>
<h2>Қолжетімділік беру</h2><form data-form="grant"><label>Пайдаланушының поштасы</label><input name="e" type="email" required><label>Курс</label><select name="c" id="gc" required></select><div id="m4"></div><button class="btn" style="margin-top:.8rem">Қолжетімділік беру</button></form>
<h2>Курстар</h2><div id="am2"></div>`},
course:id=>`<button class="btn ghost sm" data-go="edu">← Білім</button><div id="cp" style="margin-top:1rem">Жүктелуде…</div>`,
404:()=>`<div class="empty"><h1>Бұл бет табылмады.</h1><button class="btn" data-go="">Басты бетке қайту</button></div>`
};

const hooks={
async edu(){const el=$('#crs');if(!sb||!el)return;const {data,error}=await sb.from('courses').select('*').eq('published',true).order('created_at');
if(error){el.innerHTML=dbErr(error);return}
el.innerHTML=data.length?`<h2>Курстар</h2><div class="grid">${data.map(c=>`<div class="card"><h3>${esc(c.title)}</h3><p>${esc(c.description||'')}</p><small>${c.duration?esc(c.duration)+' · ':''}${c.price>0?c.price+' ₸':'Тегін'}</small><button class="btn sm" data-go="course/${c.id}" style="align-self:flex-start">Курсты ашу</button></div>`).join('')}</div>`:'<div class="msg note">Курстар әзірге қосылмаған. Әкімші қосқанда осы жерде көрінеді.</div>'},
async course(id){const el=$('#cp');if(!sb){el.innerHTML='<div class="msg note">Курстар сервер қосылғанда жұмыс істейді.</div>';return}
const {data:c}=await sb.from('courses').select('*').eq('id',id).maybeSingle();if(!c){el.innerHTML=pages[404]();return}
const head=`<h1>${esc(c.title)}</h1><p>${esc(c.description||'')}</p><p><b>${c.price>0?c.price+' ₸':'Тегін'}</b>${c.duration?' · '+esc(c.duration):''}</p>`;
if(!S.user){el.innerHTML=head+'<div class="msg">Курсты көру үшін кіріңіз.</div><button class="btn" data-go="account">Кіру немесе тіркелу</button>';return}
const {data:en}=await sb.from('enrollments').select('course_id').eq('user_id',S.user.id).eq('course_id',id);
if(S.user.role!=='admin'&&!(en&&en.length)){el.innerHTML=head+(c.price>0?`<div class="msg note">Бұл ақылы курс. Онлайн төлем әлі қосылмаған: қолжетімділікті әкімші береді.</div><button class="btn" data-ask="${esc(c.title)}">Қолжетімділік сұрау</button>`:`<button class="btn" data-enroll="${id}">Тегін жазылу</button>`);return}
const [{data:L},{data:P}]=await Promise.all([sb.from('lessons').select('*').eq('course_id',id).order('position'),sb.from('progress').select('lesson_id').eq('user_id',S.user.id)]);
const done=new Set((P||[]).map(x=>x.lesson_id));
el.innerHTML=head+(L&&L.length?`<p>Өтілген: <b id="pc">${L.filter(l=>done.has(l.id)).length}</b> / ${L.length}</p>`+L.map(l=>`<details class="card" style="margin:.5rem 0"><summary><b>${esc(l.title)}</b></summary><div style="white-space:pre-wrap;margin:.6rem 0">${esc(l.content||'')}</div><label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" style="width:auto" data-prog="${l.id}" ${done.has(l.id)?'checked':''}> Сабақты өттім</label></details>`).join(''):'<div class="empty">Сабақтар әзірге қосылмаған.</div>')},
async account(){const el=$('#myc');if(!sb||!el||!S.user)return;const {data,error}=await sb.from('enrollments').select('course_id,courses(title)').eq('user_id',S.user.id);
el.innerHTML=error?dbErr(error):(data.length?data.map(e=>`<div class="item"><b>${esc((e.courses&&e.courses.title)||'Курс')}</b><button class="btn sm" data-go="course/${e.course_id}">Жалғастыру</button></div>`).join(''):'<div class="empty">Сіз әлі курсқа жазылмадыңыз.<div class="row" style="justify-content:center"><button class="btn" data-go="edu">Курстарды көру</button></div></div>')},
async admin(){if(!sb||!(S.user&&S.user.role==='admin')||!$('#am1'))return;
const [M,C]=await Promise.all([sb.from('messages').select('*').order('created_at',{ascending:false}),sb.from('courses').select('*').order('created_at',{ascending:false})]);
$('#am1').innerHTML=M.error?dbErr(M.error):(M.data.length?M.data.map(m=>`<div class="card" style="margin:.5rem 0"><b>${esc(m.subject||'')}</b> · ${esc(m.name||'')} · <a href="mailto:${esc(m.email||'')}">${esc(m.email||'')}</a><p style="white-space:pre-wrap">${esc(m.body||'')}</p><small>${new Date(m.created_at).toLocaleString('kk-KZ')}</small></div>`).join(''):'<div class="empty">Хабарлама әзірге жоқ.</div>');
const cs=C.data||[],opt=cs.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');$('#lc').innerHTML=opt;$('#gc').innerHTML=opt;
$('#am2').innerHTML=cs.length?cs.map(c=>`<div class="item"><div><b>${esc(c.title)}</b><br><small>${c.published?'Жарияланған':'Жарияланбаған (келушілерге көрінбейді)'}</small></div><button class="btn sm ghost" data-pub="${c.id}" data-v="${!c.published}">${c.published?'Жасыру':'Жариялау'}</button></div>`).join(''):'<div class="empty">Курс әзірге жоқ.</div>'}
};
function R(){
const h=decodeURIComponent(location.hash.replace(/^#\/?/,'')),[r,a]=h.split('/');
const f=pages[r];
app.innerHTML=`<div class="page">${f?f(a):pages[404]()}</div>`;
$('#nav').innerHTML=NAV.map(n=>`<button data-go="${n[0]}" class="${n[0]===r?'on':''}">${n[1]}</button>`).join('');
scrollTo(0,0);$('#adm').hidden=sb?!(S.user&&S.user.role==='admin'):false;$('#db').hidden=!!sb;if(hooks[r])hooks[r](a);
}
const go=p=>{location.hash='#/'+p};
addEventListener('hashchange',R);

function openSearch(){
$('#ovr').innerHTML=`<div class="ov" data-close><div class="box"><label for="sq" style="margin:0 0 .4rem;font-size:1rem;color:var(--ink)">Не іздеп жүрсіз?</label><input id="sq" autocomplete="off" autofocus><div id="sr" style="margin-top:1rem"></div></div></div>`;
$('#sq').focus();
}
function doSearch(q){
q=q.trim().toLowerCase();const o=$('#sr');if(!q){o.innerHTML='';return}
const m=(...x)=>x.join(' ').toLowerCase().includes(q);
const C=COURSES.filter(c=>m(c.t,c.d)),M=MAT.filter(x=>m(x.t,x.d,x.c));
const sec=(t,l)=>l.length?`<h3>${t}</h3>${l.join('')}`:'';
const row=(t,g)=>`<div class="item" style="cursor:pointer" data-go="${g}" data-close2>${t}</div>`;
o.innerHTML=(C.length+M.length)?sec('Курстар',C.map(c=>row(c.t,'edu')))+sec('Материалдар',M.map(x=>row(x.t+' <small>(Дайындалуда)</small>','edu'))):'<div class="empty">Сұрауыңыз бойынша ештеңе табылмады. Басқа сөзбен іздеп көріңіз.</div>';
}
addEventListener('input',e=>{if(e.target.id==='sq')doSearch(e.target.value);});


addEventListener('click',e=>{
const t=e.target,q=s=>t.closest(s);
let el;
if(q('[data-fav]')){e.stopPropagation();const id=q('[data-fav]').dataset.fav,i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.textContent=i<0?'♥':'♡');if(S.tab==='favs'&&location.hash.includes('account'))R();return}
if(q('[data-search]'))return openSearch();
if(t.matches('.ov')){$('#ovr').innerHTML='';return}
if(el=q('[data-go]')){const g=el.dataset.go;$('#ovr').innerHTML='';if(g==='ask'){S.pre={s:'Оқу туралы',m:'Практикаға бағытталған оқыту бойынша сұрағым бар: '};go('contact')}else go(g);return}
if(el=q('[data-chip]')){S[el.dataset.chip]=el.dataset.v;R();return}
if(el=q('[data-tab]')){S.tab=el.dataset.tab;R();return}
if(el=q('[data-auth]')){S.authTab=el.dataset.auth;R();return}
if(q('[data-logout]')){S.user=null;save();if(sb)sb.auth.signOut();R();return}
if(el=q('[data-enroll]')){sb.from('enrollments').insert({user_id:S.user.id,course_id:el.dataset.enroll}).then(r=>{if(r.error)alert(r.error.message);else R()});return}
if(el=q('[data-ask]')){S.pre={s:'Оқу туралы',m:'«'+el.dataset.ask+'» курсына қолжетімділік сұраймын.'};go('contact');return}
if(el=q('[data-pub]')){sb.from('courses').update({published:el.dataset.v==='true'}).eq('id',el.dataset.pub).then(()=>hooks.admin());return}
if(q('[data-copy]')){const x=$('#cfg').textContent;try{navigator.clipboard.writeText(x).then(()=>{$('#lm').innerHTML='<div class="msg">Көшірілді.</div>'},()=>{$('#lm').innerHTML='<div class="msg err">Көшіру мүмкін болмады. Мәтінді қолмен таңдаңыз.</div>'})}catch(e){}}
});

addEventListener('submit',async e=>{
e.preventDefault();const f=e.target,k=f.dataset.form,d=Object.fromEntries(new FormData(f));
if(sb&&['up','in','reset','newpw'].includes(k)){await authAct(k,d);return}
if(sb&&['addc','addl','grant'].includes(k)){await adminAct(k,d,f);return}
if(k==='reset'){$('#am').innerHTML='<div class="msg err">Қалпына келтіру сервер қосылғанда ғана жұмыс істейді.</div>';return}
if(k==='contact'&&sb){const {error}=await sb.from('messages').insert({name:d.n,email:d.e,subject:d.s,body:d.m});$('#fm').innerHTML=error?'<div class="msg err">Хабарлама жіберілмеді. Қайталап көріңіз.</div>':'<div class="msg">Рақмет! Хабарламаңыз қабылданды.</div>';if(!error)f.reset();return}
if(k==='contact'){$('#fm').innerHTML='<div class="msg err">Хабарлама жіберілмеді. Қайталап көріңіз.<br><small>(Демо: сервер қосылмаған, сондықтан хабарлама жіберу мүмкін емес.)</small></div>'}
if(k==='links'){const bad=[],n={};for(const x of['kaspi','wb']){const v=(d[x]||'').trim();if(v&&!okU(x,v))bad.push(x==='kaspi'?'Kaspi':'Wildberries');n[x]=v}
if(bad.length){$('#lm').innerHTML='<div class="msg err">Сілтеме жарамсыз: '+bad.join(', ')+'. Ресми дүкеннің https:// сілтемесін енгізіңіз.</div>';return}
S.links=n;save();$('#lm').innerHTML='<div class="msg">Сақталды. Сілтеме тек осы браузерде жұмыс істейді.</div>';$('#cfg').textContent=cfgLine()}
if(k==='up'){if(S.users.find(u=>u.email===d.e)){$('#am').innerHTML='<div class="msg err">Бұл пошта тіркелген. «Кіру» бөліміне өтіңіз.</div>';return}
const u={name:d.n.trim(),email:d.e};S.users.push(u);S.user=u;save();R()}
if(k==='in'){const u=S.users.find(u=>u.email===d.e);if(!u){$('#am').innerHTML='<div class="msg err">Бұл пошта табылмады. Алдымен «Тіркелу» бөліміне өтіңіз (демо).</div>';return}S.user=u;save();R()}
});

addEventListener('change',async e=>{const x=e.target;if(sb&&x.dataset&&x.dataset.prog){const q=x.checked?sb.from('progress').upsert({user_id:S.user.id,lesson_id:x.dataset.prog}):sb.from('progress').delete().eq('user_id',S.user.id).eq('lesson_id',x.dataset.prog);const {error}=await q;if(error){x.checked=!x.checked;return}$('#pc').textContent=document.querySelectorAll('[data-prog]:checked').length}});
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.recovery=true;loadSession().then(()=>{location.hash='#/account';R()})}});
(async()=>{try{await loadSession()}catch(e){}R()})();
</script>
</body>
</html>
